<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Juego</title>
<style>
        body {
            background-image: url('https://i.pinimg.com/736x/c2/39/17/c23917fd598cc169709c6c003bf9cd08.jpg');
            
            /* Estas propiedades hacen que la imagen se adapte a toda la pantalla */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff; /* Texto blanco */
            font-family: Arial, sans-serif;
            text-align: center; /* Centramos todo */
            padding-top: 50px;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #4CAF50; /* Botón verde */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
            background-color: #1a1a1a; /* Fondo oscuro */
            color: #ffffff; /* Texto blanco */
            font-family: Arial, sans-serif;
            text-align: center; /* Centramos todo */
            padding-top: 50px;
        }
        button {
            background-color: #4CAF50; /* Botón verde */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: EL MENÚ -->
    <div id="menu">
        <h1>CriptoJuego Telegram</h1>
        <p>¡Bienvenido a la aventura!</p>
        <br>
        <button onclick="elegirHeroe()">Elegir Heroe</button>
        <br><br>
        <button>Salir</button>
    </div>

    <!-- SECCIÓN 2: EL JUEGO (Empieza oculta) -->
    <div id="juego" style="display: none;">
        <h1>¡Partida en curso!</h1>
        <p>Aquí es donde empezará la acción.</p>
        <br>
        <button onclick="volverAlMenu()">Volver al menú</button>
    </div>
    <script>
        function elegirHeroe() {
            // Ocultamos el menú
            document.getElementById('menu').style.display = 'none';
            
            // Mostramos la sección del juego
            document.getElementById('juego').style.display = 'block';
        }
        function volverAlMenu() {
            // Ocultamos la sección del juego
            document.getElementById('juego').style.display = 'none';
            // Volvemos a mostrar el menú principal
            document.getElementById('menu').style.display = 'block';
             }
    </script>

</body>
</html>
