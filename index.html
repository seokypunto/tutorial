<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Prueba Juego</title>
<style>
        body {
            background-image: url('fondo.png');
            
            /* Estas propiedades hacen que la imagen se adapte a toda la pantalla */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff; /* Texto blanco */
            font-family: Arial, sans-serif;
            text-align: center; /* Centramos todo */
            padding-top: 50px;
            height: 100vh;
            margin: 0;
        }
       button {
            background-color: #4CAF50; /* Botón verde */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }

        /* Estilo base para los botones de personajes con imagen */
.btn-personaje {
    width: 180px;
    height: 180px;
    background-size: cover;
    background-position: center;
    border: 3px solid #ffffff;
    border-radius: 20px;
    cursor: pointer;
    margin: 15px;
    display: inline-block;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
}

        .btn-goku { background-image: url('img/goku.png'); }
        .btn-krilin { background-image: url('img/krilin.png'); }
        .btn-yamcha { background-image: url('img/yamcha.png'); }
        }
      
        }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: EL MENÚ -->
    <div id="menu">
        <h1>CriptoJuego Telegram</h1>
        <p>¡Bienvenido a la aventura!</p>
        <br>
        <button onclick="elegirHeroe()">Elegir Heroe</button>
        <br><br>
        <button>Salir</button>
    </div>

<!-- ESTILOS NUEVOS PARA LAS TARJETAS DE PERSONAJES -->
<style>
    .contenedor-seleccion {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 10px;
        max-width: 400px;
        margin: 0 auto;
    }
    .tarjeta-personaje {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid #ffffff;
        border-radius: 15px;
        padding: 12px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        text-align: left;
    }
    .avatar-personaje {
        width: 100px;
        height: 100px;
        background-size: cover;
        background-position: center;
        border-radius: 10px;
        border: 2px solid #ffcc00;
        flex-shrink: 0;
    }
    .info-personaje {
        margin-left: 15px;
        flex-grow: 1;
        color: #ffffff;
    }
    .info-personaje h3 {
        margin: 0 0 5px 0;
        font-size: 18px;
        color: #ffcc00;
    }
    .info-personaje p {
        margin: 0 0 10px 0;
        font-size: 13px;
        color: #dddddd;
    }
    .btn-elegir {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-elegir:hover {
        background-color: #218838;
    }
    .avatar-goku { background-image: url('img/goku.png'); }
    .avatar-krilin { background-image: url('img/krilin.png'); }
    .avatar-yamcha { background-image: url('img/yamcha.png'); }
</style>

<!-- SECCIÓN 2: PANTALLA DE SELECCIÓN TIPO TARJETA -->
<div id="juego" style="display: none;">
    <h1 style="color: white; text-align: center;">¡Elige a tu Héroe!</h1>
    
    <div class="contenedor-seleccion">
        
        <!-- Tarjeta Goku -->
        <div class="tarjeta-personaje">
            <div class="avatar-personaje avatar-goku"></div>
            <div class="info-personaje">
                <h3>Goku</h3>
                <p>⚡ Kamehameha & Genkidama<br>💪 Luchador equilibrado</p>
                <button class="btn-elegir" onclick="elegirPersonaje('Goku')">Seleccionar</button>
            </div>
        </div>

        <!-- Tarjeta Krilin -->
        <div class="tarjeta-personaje">
            <div class="avatar-personaje avatar-krilin"></div>
            <div class="info-personaje">
                <h3>Krilin</h3>
                <p>🌀 Kienzan & Disco Destructor<br>🛡️ Agilidad y táctica</p>
                <button class="btn-elegir" onclick="elegirPersonaje('Krilin')">Seleccionar</button>
            </div>
        </div>

        <!-- Tarjeta Yamcha -->
        <div class="tarjeta-personaje">
            <div class="avatar-personaje avatar-yamcha"></div>
            <div class="info-personaje">
                <h3>Yamcha</h3>
                <p>🐺 Puño del Lobo & Sokidan<br>💥 Ataques sorpresa</p>
                <button class="btn-elegir" onclick="elegirPersonaje('Yamcha')">Seleccionar</button>
            </div>
        </div>

    </div>

    <br>
    <div style="text-align: center;">
        <button onclick="volverAlMenu()" style="padding: 10px 20px; border-radius: 8px; cursor: pointer;">Volver al menú</button>
    </div>
</div>
    <script>
  // 1. Conexión a Supabase (cambia esto por tus datos reales de tu panel de Supabase)
  const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
  const SUPABASE_ANON_KEY = 'tu-clave-anonima-de-supabase';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 2. Tu función actual modificada para guardar el héroe
  async function elegirPersonaje(nombreHeroe) {
      // Guardamos la elección en la tabla 'partidas' de Supabase
      const { error } = await supabase
          .from('partidas')
          .upsert([
              { user_id: 'jugador_1', heroe_elegido: nombreHeroe }
          ], { onConflict: ['user_id'] });

      if (error) {
          console.log('Error al guardar:', error.message);
          return;
      }

      // Ocultamos el menú y mostramos el juego (lo que ya hacías)
      document.getElementById('menu').style.display = 'none';
      document.getElementById('juego').style.display = 'block';
  }

  function volverAlMenu() {
      // Ocultamos la sección del juego
      document.getElementById('juego').style.display = 'none';
      // Volvemos a mostrar el menú principal
      document.getElementById('menu').style.display = 'block';
  }
  

</body>
</html>
