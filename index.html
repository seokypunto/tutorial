<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Juego</title>
<style>
        body {
            background-image: url('fondo.png');
            
            /* Estas propiedades hacen que la imagen se adapte a toda la pantalla */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff; /* Texto blanco */
            font-family: Arial, sans-serif;
            text-align: center; /* Centramos todo */
            padding-top: 50px;
            height: 100vh;
            margin: 0;
        }
       button {
            background-color: #4CAF50; /* Botón verde */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }

        /* Estilo base para los botones de personajes con imagen */
.btn-personaje {
    width: 180px;
    height: 180px;
    background-size: cover;
    background-position: center;
    border: 3px solid #ffffff;
    border-radius: 20px;
    cursor: pointer;
    margin: 15px;
    display: inline-block;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
}

        .btn-goku { background-image: url('img/goku.png'); }
        .btn-krilin { background-image: url('img/krilin.png'); }
        .btn-yamcha { background-image: url('img/yamcha.png'); }
        }
      
        }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: EL MENÚ -->
    <div id="menu">
        <h1>CriptoJuego Telegram</h1>
        <p>¡Bienvenido a la aventura!</p>
        <br>
        <button onclick="elegirHeroe()">Elegir Heroe</button>
        <br><br>
        <button>Salir</button>
    </div>

    <!-- SECCIÓN 2: EL JUEGO (Empieza oculta) -->
    <div id="juego" style="display: none;">
        <h1>¡Elige a tu Héroe!</h1>
        <br>
       <button class="btn-personaje btn-goku" onclick="elegirPersonaje('Goku')"></button>
<br><br>
<button class="btn-personaje btn-krilin" onclick="elegirPersonaje('Krilin')"></button>
<br><br>
<button class="btn-personaje btn-yamcha" onclick="elegirPersonaje('Yamcha')"></button>
        <br><br>
        <button onclick="volverAlMenu()">Volver al menú</button>
    </div>
    <script>
        function elegirHeroe() {
            // Ocultamos el menú
            document.getElementById('menu').style.display = 'none';
            
            // Mostramos la sección del juego
            document.getElementById('juego').style.display = 'block';
        }
        function volverAlMenu() {
            // Ocultamos la sección del juego
            document.getElementById('juego').style.display = 'none';
            // Volvemos a mostrar el menú principal
            document.getElementById('menu').style.display = 'block';
             }
    </script>

</body>
</html>
